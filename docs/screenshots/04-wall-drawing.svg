<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sh4"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
  </defs>

  <rect width="1280" height="800" fill="#f1f5f9"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="288" height="800" fill="white" filter="url(#sh4)"/>
  <rect x="0" y="0" width="288" height="56" fill="#2563eb"/>
  <g transform="translate(16,28)" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
    <path d="M-10,-6 A14,14 0 0,1 10,-6"/>
    <path d="M-7,-1 A9,9 0 0,1 7,-1"/>
    <path d="M-4,4 A5,5 0 0,1 4,4"/>
    <circle cx="0" cy="8" r="2" fill="white" stroke="none"/>
  </g>
  <text x="46" y="24" fill="white" font-size="15" font-weight="700">WiFi Planner</text>
  <text x="46" y="40" fill="#93c5fd" font-size="11">Network Coverage Planning</text>
  <circle cx="265" cy="24" r="4" fill="#4ade80"/>
  <text x="272" y="28" fill="#86efac" font-size="11" font-weight="500">WASM</text>

  <!-- Tools section -->
  <text x="12" y="80" fill="#6b7280" font-size="10" font-weight="600" letter-spacing="0.5">TOOLS</text>
  <rect x="12" y="88" width="124" height="36" rx="8" fill="#f1f5f9"/>
  <text x="26" y="110" fill="#374151" font-size="12">Select / Move</text>
  <rect x="142" y="88" width="134" height="36" rx="8" fill="#f1f5f9"/>
  <text x="156" y="110" fill="#374151" font-size="12">Place Access Point</text>
  <!-- Draw Wall (active) -->
  <rect x="12" y="128" width="124" height="36" rx="8" fill="#2563eb"/>
  <text x="26" y="150" fill="white" font-size="12" font-weight="500">Draw Wall</text>
  <rect x="142" y="128" width="134" height="36" rx="8" fill="#f1f5f9"/>
  <text x="156" y="150" fill="#374151" font-size="12">Erase</text>

  <!-- Wall Type selector -->
  <text x="12" y="185" fill="#374151" font-size="11" font-weight="500">Wall Type</text>

  <!-- Light wall (active with blue border) -->
  <rect x="12" y="192" width="264" height="34" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="24" y="205" width="6" height="10" rx="2" fill="#94a3b8"/>
  <text x="38" y="213" fill="#1d4ed8" font-size="12" font-weight="500">Light Wall</text>
  <text x="262" y="213" fill="#6b7280" font-size="11" text-anchor="end">−3dB</text>

  <!-- Glass -->
  <rect x="12" y="230" width="264" height="34" rx="8" fill="#f9fafb"/>
  <rect x="24" y="241" width="4" height="12" rx="2" fill="#7dd3fc"/>
  <text x="38" y="251" fill="#374151" font-size="12">Glass</text>
  <text x="262" y="251" fill="#6b7280" font-size="11" text-anchor="end">−2dB</text>

  <!-- Concrete -->
  <rect x="12" y="268" width="264" height="34" rx="8" fill="#f9fafb"/>
  <rect x="24" y="278" width="12" height="12" rx="2" fill="#475569"/>
  <text x="44" y="288" fill="#374151" font-size="12">Concrete</text>
  <text x="262" y="288" fill="#6b7280" font-size="11" text-anchor="end">−15dB</text>

  <!-- Exterior -->
  <rect x="12" y="306" width="264" height="34" rx="8" fill="#f9fafb"/>
  <rect x="24" y="316" width="16" height="12" rx="2" fill="#1e293b"/>
  <text x="48" y="326" fill="#374151" font-size="12">Exterior Wall</text>
  <text x="262" y="326" fill="#6b7280" font-size="11" text-anchor="end">−20dB</text>

  <!-- Hint box -->
  <rect x="12" y="354" width="264" height="60" rx="8" fill="#fefce8" stroke="#fde047" stroke-width="1"/>
  <text x="22" y="373" fill="#854d0e" font-size="11" font-weight="500">Drawing wall…</text>
  <text x="22" y="390" fill="#92400e" font-size="10">Click to set end point</text>
  <text x="22" y="405" fill="#92400e" font-size="10">ESC to cancel</text>

  <!-- Wall type legend -->
  <text x="12" y="438" fill="#6b7280" font-size="10" font-weight="600" letter-spacing="0.5">WALL ATTENUATION GUIDE</text>
  <g transform="translate(12,445)">
    <line x1="0" y1="10" x2="30" y2="10" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <text x="36" y="14" fill="#374151" font-size="11">Light (drywall) −3 dB</text>
    <line x1="0" y1="30" x2="30" y2="30" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
    <text x="36" y="34" fill="#374151" font-size="11">Glass partition −2 dB</text>
    <line x1="0" y1="50" x2="30" y2="50" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <text x="36" y="54" fill="#374151" font-size="11">Concrete −15 dB</text>
    <line x1="0" y1="70" x2="30" y2="70" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
    <text x="36" y="74" fill="#374151" font-size="11">Exterior wall −20 dB</text>
  </g>

  <!-- ═══ CANVAS ═══ -->
  <rect x="288" y="0" width="992" height="800" fill="#f8fafc"/>
  <rect x="308" y="20" width="952" height="760" rx="4" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh4)"/>

  <!-- Grid -->
  <g stroke="#e2e8f0" stroke-width="0.5" opacity="0.6">
    <line x1="348" y1="20" x2="348" y2="780"/><line x1="388" y1="20" x2="388" y2="780"/>
    <line x1="428" y1="20" x2="428" y2="780"/><line x1="468" y1="20" x2="468" y2="780"/>
    <line x1="508" y1="20" x2="508" y2="780"/><line x1="548" y1="20" x2="548" y2="780"/>
    <line x1="588" y1="20" x2="588" y2="780"/><line x1="628" y1="20" x2="628" y2="780"/>
    <line x1="668" y1="20" x2="668" y2="780"/><line x1="708" y1="20" x2="708" y2="780"/>
    <line x1="748" y1="20" x2="748" y2="780"/><line x1="788" y1="20" x2="788" y2="780"/>
    <line x1="828" y1="20" x2="828" y2="780"/><line x1="868" y1="20" x2="868" y2="780"/>
    <line x1="908" y1="20" x2="908" y2="780"/><line x1="948" y1="20" x2="948" y2="780"/>
    <line x1="988" y1="20" x2="988" y2="780"/>
    <line x1="308" y1="60" x2="1260" y2="60"/><line x1="308" y1="100" x2="1260" y2="100"/>
    <line x1="308" y1="140" x2="1260" y2="140"/><line x1="308" y1="180" x2="1260" y2="180"/>
    <line x1="308" y1="220" x2="1260" y2="220"/><line x1="308" y1="260" x2="1260" y2="260"/>
    <line x1="308" y1="300" x2="1260" y2="300"/><line x1="308" y1="340" x2="1260" y2="340"/>
    <line x1="308" y1="380" x2="1260" y2="380"/><line x1="308" y1="420" x2="1260" y2="420"/>
    <line x1="308" y1="460" x2="1260" y2="460"/><line x1="308" y1="500" x2="1260" y2="500"/>
    <line x1="308" y1="540" x2="1260" y2="540"/><line x1="308" y1="580" x2="1260" y2="580"/>
    <line x1="308" y1="620" x2="1260" y2="620"/>
  </g>

  <!-- Exterior walls (thick dark) -->
  <rect x="380" y="80" width="800" height="520" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>

  <!-- Concrete interior dividers -->
  <line x1="580" y1="80" x2="580" y2="420" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <line x1="380" y1="420" x2="900" y2="420" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <line x1="900" y1="80" x2="900" y2="600" stroke="#475569" stroke-width="6" stroke-linecap="round"/>

  <!-- Light walls (thin grey) -->
  <line x1="580" y1="220" x2="900" y2="220" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="380" y1="280" x2="580" y2="280" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="900" y1="300" x2="1180" y2="300" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

  <!-- Glass partition (cyan) -->
  <line x1="580" y1="420" x2="580" y2="600" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>

  <!-- Wall-in-progress: dashed blue line from anchor to mouse cursor -->
  <circle cx="680" cy="80" r="5" fill="#3b82f6" stroke="white" stroke-width="2"/>
  <line x1="680" y1="80" x2="880" y2="340" stroke="#3b82f6" stroke-width="3" stroke-dasharray="8,4" stroke-linecap="round"/>
  <!-- Cursor crosshair at end -->
  <circle cx="880" cy="340" r="8" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="2" stroke-dasharray="3,2"/>
  <line x1="870" y1="340" x2="890" y2="340" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="880" y1="330" x2="880" y2="350" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Hint banner -->
  <rect x="500" y="28" width="340" height="28" rx="6" fill="#3b82f6" opacity="0.9"/>
  <text x="670" y="46" fill="white" font-size="13" text-anchor="middle" font-weight="500">Click to set wall end point · ESC to cancel</text>

  <!-- Wall labels (tooltips) -->
  <rect x="395" y="240" width="96" height="20" rx="4" fill="#1e293b" opacity="0.8"/>
  <text x="443" y="254" fill="white" font-size="10" text-anchor="middle">Exterior −20dB</text>
  <rect x="598" y="340" width="90" height="20" rx="4" fill="#475569" opacity="0.8"/>
  <text x="643" y="354" fill="white" font-size="10" text-anchor="middle">Concrete −15dB</text>
  <rect x="590" y="480" width="76" height="20" rx="4" fill="#0ea5e9" opacity="0.8"/>
  <text x="628" y="494" fill="white" font-size="10" text-anchor="middle">Glass −2dB</text>

  <!-- APs (semi-transparent in wall drawing mode) -->
  <g opacity="0.6">
    <g transform="translate(480,180)">
      <circle r="20" fill="#3b82f6"/>
      <g fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
        <path d="M-9,-5 A12,12 0 0,1 9,-5"/>
        <path d="M-6,0 A8,8 0 0,1 6,0"/>
        <path d="M-3,5 A4,4 0 0,1 3,5"/>
        <circle cx="0" cy="9" r="1.5" fill="white" stroke="none"/>
      </g>
      <text y="36" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="600" stroke="white" stroke-width="3" paint-order="stroke">AP 1</text>
    </g>
    <g transform="translate(980,200)">
      <circle r="20" fill="#10b981"/>
      <g fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
        <path d="M-9,-5 A12,12 0 0,1 9,-5"/>
        <path d="M-6,0 A8,8 0 0,1 6,0"/>
        <path d="M-3,5 A4,4 0 0,1 3,5"/>
        <circle cx="0" cy="9" r="1.5" fill="white" stroke="none"/>
      </g>
      <text y="36" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="600" stroke="white" stroke-width="3" paint-order="stroke">AP 2</text>
    </g>
  </g>

  <!-- Scale bar -->
  <rect x="320" y="770" width="100" height="3" fill="#475569"/>
  <line x1="320" y1="765" x2="320" y2="776" stroke="#475569" stroke-width="2"/>
  <line x1="420" y1="765" x2="420" y2="776" stroke="#475569" stroke-width="2"/>
  <text x="320" y="787" fill="#475569" font-size="11" font-family="monospace">5m</text>

  <!-- Coordinate display -->
  <rect x="1190" y="768" width="70" height="20" rx="4" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1225" y="782" fill="#64748b" font-size="10" font-family="monospace" text-anchor="middle">29.6m, 16.1m</text>
</svg>
