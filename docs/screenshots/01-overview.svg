<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <!-- Heatmap gradient regions -->
    <radialGradient id="hm1" cx="38%" cy="42%" r="28%">
      <stop offset="0%" stop-color="#00c800" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#c8c800" stop-opacity="0.68"/>
      <stop offset="65%" stop-color="#dc6400" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e60000" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="hm2" cx="68%" cy="35%" r="22%">
      <stop offset="0%" stop-color="#00c800" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#c8c800" stop-opacity="0.68"/>
      <stop offset="70%" stop-color="#dc6400" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e60000" stop-opacity="0.15"/>
    </radialGradient>
    <radialGradient id="hm3" cx="55%" cy="72%" r="20%">
      <stop offset="0%" stop-color="#00c800" stop-opacity="0.72"/>
      <stop offset="45%" stop-color="#c8c800" stop-opacity="0.65"/>
      <stop offset="75%" stop-color="#dc6400" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- App background -->
  <rect width="1280" height="800" fill="#f1f5f9"/>

  <!-- ═══ SIDEBAR ═══ -->
  <rect x="0" y="0" width="288" height="800" fill="white" filter="url(#shadow)"/>

  <!-- Sidebar header -->
  <rect x="0" y="0" width="288" height="56" fill="#2563eb"/>
  <!-- WiFi icon -->
  <g transform="translate(16,28)" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
    <path d="M-10,-6 A14,14 0 0,1 10,-6"/>
    <path d="M-7,-1 A9,9 0 0,1 7,-1"/>
    <path d="M-4,4 A5,5 0 0,1 4,4"/>
    <circle cx="0" cy="8" r="2" fill="white" stroke="none"/>
  </g>
  <text x="46" y="24" fill="white" font-size="15" font-weight="700">WiFi Planner</text>
  <text x="46" y="40" fill="#93c5fd" font-size="11">Network Coverage Planning</text>
  <!-- WASM badge -->
  <circle cx="265" cy="24" r="4" fill="#4ade80"/>
  <text x="272" y="28" fill="#86efac" font-size="11" font-weight="500">WASM</text>

  <!-- Floor Plan section -->
  <text x="12" y="78" fill="#6b7280" font-size="10" font-weight="600" letter-spacing="0.5">FLOOR PLAN</text>
  <rect x="12" y="84" width="264" height="72" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="80" y="100" width="128" height="40" rx="4" fill="#e2e8f0"/>
  <text x="144" y="116" fill="#94a3b8" font-size="11" text-anchor="middle">floorplan.png</text>
  <text x="144" y="130" fill="#64748b" font-size="10" text-anchor="middle">1000 × 700 px</text>

  <!-- Divider -->
  <line x1="0" y1="168" x2="288" y2="168" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Tools section -->
  <text x="12" y="186" fill="#6b7280" font-size="10" font-weight="600" letter-spacing="0.5">TOOLS</text>
  <!-- Select (active) -->
  <rect x="12" y="192" width="124" height="36" rx="8" fill="#2563eb"/>
  <text x="50" y="214" fill="white" font-size="12" font-weight="500">Select / Move</text>
  <rect x="122" y="199" width="14" height="22" rx="3" fill="#1d4ed8"/>
  <text x="129" y="214" fill="#bfdbfe" font-size="10" text-anchor="middle">1</text>
  <!-- Place AP -->
  <rect x="142" y="192" width="134" height="36" rx="8" fill="#f1f5f9"/>
  <text x="172" y="214" fill="#374151" font-size="12">Place Access Point</text>
  <!-- Draw Wall -->
  <rect x="12" y="232" width="124" height="36" rx="8" fill="#f1f5f9"/>
  <text x="26" y="254" fill="#374151" font-size="12">Draw Wall</text>
  <!-- Erase -->
  <rect x="142" y="232" width="134" height="36" rx="8" fill="#f1f5f9"/>
  <text x="158" y="254" fill="#374151" font-size="12">Erase</text>

  <!-- Divider -->
  <line x1="0" y1="280" x2="288" y2="280" stroke="#e2e8f0" stroke-width="1"/>

  <!-- AP list -->
  <text x="12" y="298" fill="#6b7280" font-size="10" font-weight="600" letter-spacing="0.5">ACCESS POINTS (3)</text>
  <!-- AP 1 -->
  <rect x="12" y="306" width="264" height="40" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <circle cx="28" cy="326" r="6" fill="#3b82f6"/>
  <text x="42" y="322" fill="#1e40af" font-size="12" font-weight="600">AP 1</text>
  <text x="42" y="336" fill="#6b7280" font-size="10">2.4GHz · ch 6 · 20dBm</text>
  <!-- AP 2 -->
  <rect x="12" y="350" width="264" height="40" rx="8" fill="#f9fafb"/>
  <circle cx="28" cy="370" r="6" fill="#10b981"/>
  <text x="42" y="366" fill="#374151" font-size="12" font-weight="600">AP 2</text>
  <text x="42" y="380" fill="#6b7280" font-size="10">5GHz · ch 36 · 23dBm</text>
  <!-- AP 3 -->
  <rect x="12" y="394" width="264" height="40" rx="8" fill="#f9fafb"/>
  <circle cx="28" cy="414" r="6" fill="#f59e0b"/>
  <text x="42" y="410" fill="#374151" font-size="12" font-weight="600">AP 3</text>
  <text x="42" y="424" fill="#6b7280" font-size="10">2.4GHz · ch 1 · 20dBm</text>

  <!-- Divider -->
  <line x1="0" y1="446" x2="288" y2="446" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Heatmap toggle -->
  <text x="12" y="464" fill="#6b7280" font-size="10" font-weight="600" letter-spacing="0.5">HEATMAP</text>
  <rect x="220" y="452" width="36" height="20" rx="10" fill="#2563eb"/>
  <circle cx="246" cy="462" r="8" fill="white"/>
  <text x="262" y="466" fill="#374151" font-size="11">On</text>
  <!-- Band selector -->
  <rect x="12" y="472" width="84" height="28" rx="6" fill="#2563eb"/>
  <text x="54" y="490" fill="white" font-size="12" text-anchor="middle" font-weight="500">2.4GHz</text>
  <rect x="100" y="472" width="84" height="28" rx="6" fill="#f1f5f9"/>
  <text x="142" y="490" fill="#374151" font-size="12" text-anchor="middle">5GHz</text>
  <rect x="188" y="472" width="84" height="28" rx="6" fill="#f1f5f9"/>
  <text x="230" y="490" fill="#374151" font-size="12" text-anchor="middle">6GHz</text>

  <!-- Coverage stats -->
  <rect x="12" y="510" width="264" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="530" fill="#6b7280" font-size="10" font-weight="600" letter-spacing="0.5">COVERAGE STATS</text>
  <text x="24" y="548" fill="#374151" font-size="11">Total Coverage</text>
  <text x="244" y="548" fill="#1e293b" font-size="11" font-weight="600" text-anchor="end">78.4%</text>
  <!-- Coverage bar -->
  <rect x="24" y="554" width="240" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="24" y="554" width="106" height="10" rx="5" fill="#00c800"/>
  <rect x="130" y="554" width="68" height="10" rx="0" fill="#c8c800"/>
  <rect x="198" y="554" width="40" height="10" rx="0" fill="#dc6400"/>
  <rect x="238" y="554" width="10" height="10" rx="0" fill="#e60000" clip-path="url(#bar-clip)"/>
  <!-- Stats grid -->
  <text x="24" y="582" fill="#16a34a" font-size="11" font-weight="500">Excellent</text>
  <text x="150" y="582" fill="#374151" font-size="11" text-anchor="end">44.1%</text>
  <text x="164" y="582" fill="#65a30d" font-size="11" font-weight="500">Good</text>
  <text x="276" y="582" fill="#374151" font-size="11" text-anchor="end">28.3%</text>
  <text x="24" y="600" fill="#d97706" font-size="11" font-weight="500">Fair</text>
  <text x="150" y="600" fill="#374151" font-size="11" text-anchor="end">6.0%</text>
  <text x="164" y="600" fill="#dc2626" font-size="11" font-weight="500">Poor</text>
  <text x="276" y="600" fill="#374151" font-size="11" text-anchor="end">4.2%</text>
  <line x1="24" y1="608" x2="276" y2="608" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="622" fill="#6b7280" font-size="11">Avg RSSI</text>
  <text x="276" y="622" fill="#374151" font-size="11" font-weight="500" text-anchor="end">−61.3 dBm</text>

  <!-- ═══ CANVAS ═══ -->
  <!-- Canvas area background -->
  <rect x="288" y="0" width="992" height="800" fill="#f8fafc"/>

  <!-- Floor plan white area -->
  <rect x="308" y="20" width="952" height="760" rx="4" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Grid lines (light) -->
  <g stroke="#e2e8f0" stroke-width="0.5" opacity="0.8">
    <line x1="328" y1="20" x2="328" y2="780"/><line x1="368" y1="20" x2="368" y2="780"/>
    <line x1="408" y1="20" x2="408" y2="780"/><line x1="448" y1="20" x2="448" y2="780"/>
    <line x1="488" y1="20" x2="488" y2="780"/><line x1="528" y1="20" x2="528" y2="780"/>
    <line x1="568" y1="20" x2="568" y2="780"/><line x1="608" y1="20" x2="608" y2="780"/>
    <line x1="648" y1="20" x2="648" y2="780"/><line x1="688" y1="20" x2="688" y2="780"/>
    <line x1="728" y1="20" x2="728" y2="780"/><line x1="768" y1="20" x2="768" y2="780"/>
    <line x1="808" y1="20" x2="808" y2="780"/><line x1="848" y1="20" x2="848" y2="780"/>
    <line x1="888" y1="20" x2="888" y2="780"/><line x1="928" y1="20" x2="928" y2="780"/>
    <line x1="968" y1="20" x2="968" y2="780"/><line x1="1008" y1="20" x2="1008" y2="780"/>
    <line x1="1048" y1="20" x2="1048" y2="780"/><line x1="1088" y1="20" x2="1088" y2="780"/>
    <line x1="1128" y1="20" x2="1128" y2="780"/><line x1="1168" y1="20" x2="1168" y2="780"/>
    <line x1="1208" y1="20" x2="1208" y2="780"/>
    <line x1="308" y1="60" x2="1260" y2="60"/><line x1="308" y1="100" x2="1260" y2="100"/>
    <line x1="308" y1="140" x2="1260" y2="140"/><line x1="308" y1="180" x2="1260" y2="180"/>
    <line x1="308" y1="220" x2="1260" y2="220"/><line x1="308" y1="260" x2="1260" y2="260"/>
    <line x1="308" y1="300" x2="1260" y2="300"/><line x1="308" y1="340" x2="1260" y2="340"/>
    <line x1="308" y1="380" x2="1260" y2="380"/><line x1="308" y1="420" x2="1260" y2="420"/>
    <line x1="308" y1="460" x2="1260" y2="460"/><line x1="308" y1="500" x2="1260" y2="500"/>
    <line x1="308" y1="540" x2="1260" y2="540"/><line x1="308" y1="580" x2="1260" y2="580"/>
    <line x1="308" y1="620" x2="1260" y2="620"/><line x1="308" y1="660" x2="1260" y2="660"/>
    <line x1="308" y1="700" x2="1260" y2="700"/><line x1="308" y1="740" x2="1260" y2="740"/>
  </g>

  <!-- Heatmap overlay -->
  <rect x="308" y="20" width="952" height="760" fill="url(#hm1)" rx="4"/>
  <rect x="308" y="20" width="952" height="760" fill="url(#hm2)" rx="4"/>
  <rect x="308" y="20" width="952" height="760" fill="url(#hm3)" rx="4"/>

  <!-- Walls -->
  <g stroke="#475569" stroke-linecap="round">
    <!-- Outer walls -->
    <rect x="380" y="80" width="560" height="420" fill="none" stroke="#1e293b" stroke-width="6"/>
    <!-- Interior walls -->
    <line x1="560" y1="80" x2="560" y2="320" stroke="#475569" stroke-width="4"/>
    <line x1="380" y1="320" x2="780" y2="320" stroke="#475569" stroke-width="4"/>
    <line x1="780" y1="80" x2="780" y2="500" stroke="#475569" stroke-width="4"/>
    <line x1="560" y1="200" x2="780" y2="200" stroke="#94a3b8" stroke-width="3"/>
  </g>

  <!-- AP 1 - blue -->
  <g transform="translate(540,200)">
    <circle r="30" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3"/>
    <circle r="20" fill="#3b82f6" fill-opacity="0.9"/>
    <g fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
      <path d="M-9,-5 A12,12 0 0,1 9,-5"/>
      <path d="M-6,0 A8,8 0 0,1 6,0"/>
      <path d="M-3,5 A4,4 0 0,1 3,5"/>
      <circle cx="0" cy="9" r="1.5" fill="white" stroke="none"/>
    </g>
    <text y="36" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="600" stroke="white" stroke-width="3" paint-order="stroke">AP 1</text>
    <text y="47" text-anchor="middle" font-size="9" fill="#64748b" stroke="white" stroke-width="2" paint-order="stroke">2.4GHz · 20dBm</text>
  </g>

  <!-- AP 2 - green -->
  <g transform="translate(830,180)">
    <circle r="30" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
    <circle r="20" fill="#10b981" fill-opacity="0.9"/>
    <g fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
      <path d="M-9,-5 A12,12 0 0,1 9,-5"/>
      <path d="M-6,0 A8,8 0 0,1 6,0"/>
      <path d="M-3,5 A4,4 0 0,1 3,5"/>
      <circle cx="0" cy="9" r="1.5" fill="white" stroke="none"/>
    </g>
    <text y="36" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="600" stroke="white" stroke-width="3" paint-order="stroke">AP 2</text>
    <text y="47" text-anchor="middle" font-size="9" fill="#64748b" stroke="white" stroke-width="2" paint-order="stroke">5GHz · 23dBm</text>
  </g>

  <!-- AP 3 - amber -->
  <g transform="translate(680,540)">
    <circle r="30" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
    <circle r="20" fill="#f59e0b" fill-opacity="0.9"/>
    <g fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
      <path d="M-9,-5 A12,12 0 0,1 9,-5"/>
      <path d="M-6,0 A8,8 0 0,1 6,0"/>
      <path d="M-3,5 A4,4 0 0,1 3,5"/>
      <circle cx="0" cy="9" r="1.5" fill="white" stroke="none"/>
    </g>
    <text y="36" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="600" stroke="white" stroke-width="3" paint-order="stroke">AP 3</text>
    <text y="47" text-anchor="middle" font-size="9" fill="#64748b" stroke="white" stroke-width="2" paint-order="stroke">2.4GHz · 20dBm</text>
  </g>

  <!-- Scale bar -->
  <rect x="320" y="770" width="80" height="3" fill="#475569"/>
  <line x1="320" y1="765" x2="320" y2="775" stroke="#475569" stroke-width="2"/>
  <line x1="400" y1="765" x2="400" y2="775" stroke="#475569" stroke-width="2"/>
  <text x="320" y="785" fill="#475569" font-size="10" font-family="monospace">4m</text>

  <!-- Coordinate display -->
  <rect x="1190" y="768" width="70" height="20" rx="4" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1225" y="782" fill="#64748b" font-size="10" font-family="monospace" text-anchor="middle">24.5m, 18.2m</text>
</svg>
