<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sh5"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <radialGradient id="h51" cx="38%" cy="40%" r="33%">
      <stop offset="0%"   stop-color="#00c800" stop-opacity="0.76"/>
      <stop offset="38%"  stop-color="#c8c800" stop-opacity="0.68"/>
      <stop offset="68%"  stop-color="#dc6400" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e60000" stop-opacity="0.12"/>
    </radialGradient>
    <radialGradient id="h52" cx="70%" cy="33%" r="27%">
      <stop offset="0%"   stop-color="#00c800" stop-opacity="0.76"/>
      <stop offset="42%"  stop-color="#c8c800" stop-opacity="0.67"/>
      <stop offset="75%"  stop-color="#dc6400" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="h53" cx="54%" cy="74%" r="22%">
      <stop offset="0%"   stop-color="#00c800" stop-opacity="0.74"/>
      <stop offset="40%"  stop-color="#c8c800" stop-opacity="0.64"/>
      <stop offset="72%"  stop-color="#dc6400" stop-opacity="0.44"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="800" fill="#f1f5f9"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="288" height="800" fill="white" filter="url(#sh5)"/>
  <rect x="0" y="0" width="288" height="56" fill="#2563eb"/>
  <g transform="translate(16,28)" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
    <path d="M-10,-6 A14,14 0 0,1 10,-6"/>
    <path d="M-7,-1 A9,9 0 0,1 7,-1"/>
    <path d="M-4,4 A5,5 0 0,1 4,4"/>
    <circle cx="0" cy="8" r="2" fill="white" stroke="none"/>
  </g>
  <text x="46" y="24" fill="white" font-size="15" font-weight="700">WiFi Planner</text>
  <text x="46" y="40" fill="#93c5fd" font-size="11">Network Coverage Planning</text>
  <circle cx="265" cy="24" r="4" fill="#4ade80"/>
  <text x="272" y="28" fill="#86efac" font-size="11" font-weight="500">WASM</text>

  <!-- Heatmap controls -->
  <text x="12" y="76" fill="#6b7280" font-size="10" font-weight="600" letter-spacing="0.5">HEATMAP</text>
  <rect x="220" y="64" width="36" height="20" rx="10" fill="#2563eb"/>
  <circle cx="246" cy="74" r="8" fill="white"/>
  <text x="262" y="78" fill="#374151" font-size="11">On</text>

  <!-- Band buttons -->
  <rect x="12" y="84" width="84" height="28" rx="6" fill="#2563eb"/>
  <text x="54" y="102" fill="white" font-size="12" text-anchor="middle" font-weight="500">2.4GHz</text>
  <rect x="100" y="84" width="84" height="28" rx="6" fill="#f1f5f9"/>
  <text x="142" y="102" fill="#374151" font-size="12" text-anchor="middle">5GHz</text>
  <rect x="188" y="84" width="84" height="28" rx="6" fill="#f1f5f9"/>
  <text x="230" y="102" fill="#374151" font-size="12" text-anchor="middle">6GHz</text>

  <!-- Resolution slider -->
  <text x="12" y="130" fill="#374151" font-size="11" font-weight="500">Resolution</text>
  <text x="276" y="130" fill="#6b7280" font-size="10" text-anchor="end">Medium</text>
  <rect x="12" y="136" width="264" height="5" rx="2.5" fill="#e2e8f0"/>
  <rect x="12" y="136" width="88" height="5" rx="2.5" fill="#2563eb"/>
  <circle cx="100" cy="138.5" r="8" fill="white" stroke="#2563eb" stroke-width="2"/>
  <text x="12" y="158" fill="#9ca3af" font-size="10">High</text>
  <text x="276" y="158" fill="#9ca3af" font-size="10" text-anchor="end">Low (faster)</text>

  <!-- Signal legend -->
  <text x="12" y="180" fill="#374151" font-size="11" font-weight="500">Signal Legend</text>
  <g transform="translate(12,186)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#00c800" opacity="0.8"/>
    <text x="18" y="10" fill="#374151" font-size="11">Excellent</text>
    <text x="198" y="10" fill="#6b7280" font-size="10" text-anchor="end">&gt; −50 dBm</text>

    <rect x="0" y="18" width="12" height="12" rx="2" fill="#c8c800" opacity="0.8"/>
    <text x="18" y="28" fill="#374151" font-size="11">Good</text>
    <text x="198" y="28" fill="#6b7280" font-size="10" text-anchor="end">−50 to −60</text>

    <rect x="0" y="36" width="12" height="12" rx="2" fill="#dc6400" opacity="0.8"/>
    <text x="18" y="46" fill="#374151" font-size="11">Fair</text>
    <text x="198" y="46" fill="#6b7280" font-size="10" text-anchor="end">−60 to −70</text>

    <rect x="0" y="54" width="12" height="12" rx="2" fill="#e60000" opacity="0.8"/>
    <text x="18" y="64" fill="#374151" font-size="11">Poor</text>
    <text x="198" y="64" fill="#6b7280" font-size="10" text-anchor="end">−70 to −80</text>

    <rect x="0" y="72" width="12" height="12" rx="2" fill="#9ca3af" opacity="0.6"/>
    <text x="18" y="82" fill="#374151" font-size="11">No signal</text>
    <text x="198" y="82" fill="#6b7280" font-size="10" text-anchor="end">&lt; −80 dBm</text>
  </g>

  <!-- ───── Coverage Stats Panel ───── -->
  <rect x="12" y="288" width="264" height="330" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="24" y="312" fill="#6b7280" font-size="10" font-weight="600" letter-spacing="0.5">COVERAGE STATISTICS</text>

  <!-- Total coverage -->
  <text x="24" y="334" fill="#374151" font-size="12" font-weight="500">Total Coverage</text>
  <text x="264" y="334" fill="#1e293b" font-size="14" font-weight="700" text-anchor="end">78.4%</text>

  <!-- Stacked bar -->
  <rect x="24" y="340" width="240" height="16" rx="8" fill="#e2e8f0"/>
  <rect x="24" y="340" width="106" height="16" rx="8" fill="#00c800"/>
  <rect x="130" y="340" width="68" height="16" rx="0" fill="#c8c800"/>
  <rect x="198" y="340" width="24" height="16" rx="0" fill="#dc6400"/>
  <rect x="222" y="340" width="14" height="16" rx="0" fill="#e60000"/>
  <!-- Right end cap -->
  <rect x="224" y="340" width="40" height="16" rx="0 8 8 0" fill="#e2e8f0"/>

  <!-- Per-tier stats (2-column grid) -->
  <g transform="translate(24,372)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="110" height="52" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="16" cy="16" r="6" fill="#00c800"/>
    <text x="28" y="20" fill="#374151" font-size="11" font-weight="500">Excellent</text>
    <text x="8" y="44" fill="#1e293b" font-size="22" font-weight="700">44.1</text>
    <text x="68" y="44" fill="#6b7280" font-size="14">%</text>

    <rect x="120" y="0" width="110" height="52" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="136" cy="16" r="6" fill="#c8c800"/>
    <text x="148" y="20" fill="#374151" font-size="11" font-weight="500">Good</text>
    <text x="128" y="44" fill="#1e293b" font-size="22" font-weight="700">28.3</text>
    <text x="188" y="44" fill="#6b7280" font-size="14">%</text>

    <!-- Row 2 -->
    <rect x="0" y="62" width="110" height="52" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="16" cy="78" r="6" fill="#dc6400"/>
    <text x="28" y="82" fill="#374151" font-size="11" font-weight="500">Fair</text>
    <text x="8" y="106" fill="#1e293b" font-size="22" font-weight="700">6.0</text>
    <text x="54" y="106" fill="#6b7280" font-size="14">%</text>

    <rect x="120" y="62" width="110" height="52" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="136" cy="78" r="6" fill="#e60000"/>
    <text x="148" y="82" fill="#374151" font-size="11" font-weight="500">Poor</text>
    <text x="128" y="106" fill="#1e293b" font-size="22" font-weight="700">4.2</text>
    <text x="174" y="106" fill="#6b7280" font-size="14">%</text>

    <!-- Row 3 -->
    <rect x="0" y="124" width="110" height="52" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="16" cy="140" r="6" fill="#9ca3af"/>
    <text x="28" y="144" fill="#374151" font-size="11" font-weight="500">No Signal</text>
    <text x="8" y="168" fill="#1e293b" font-size="22" font-weight="700">17.6</text>
    <text x="68" y="168" fill="#6b7280" font-size="14">%</text>

    <!-- Avg RSSI card -->
    <rect x="120" y="124" width="110" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="175" y="140" fill="#1d4ed8" font-size="11" font-weight="500" text-anchor="middle">Avg RSSI</text>
    <text x="128" y="168" fill="#1e40af" font-size="22" font-weight="700">−61.3</text>
    <text x="222" y="168" fill="#3b82f6" font-size="12">dBm</text>
  </g>

  <!-- Divider -->
  <line x1="24" y1="562" x2="264" y2="562" stroke="#e2e8f0" stroke-width="1"/>

  <!-- AP breakdown -->
  <text x="24" y="578" fill="#6b7280" font-size="10" font-weight="600" letter-spacing="0.5">PER-AP CONTRIBUTION</text>
  <!-- AP1 bar -->
  <text x="24" y="596" fill="#374151" font-size="11">AP 1</text>
  <rect x="60" y="585" width="190" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="60" y="585" width="130" height="10" rx="5" fill="#3b82f6" opacity="0.7"/>
  <text x="256" y="596" fill="#6b7280" font-size="10" text-anchor="end">68%</text>
  <!-- AP2 bar -->
  <text x="24" y="614" fill="#374151" font-size="11">AP 2</text>
  <rect x="60" y="603" width="190" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="60" y="603" width="110" height="10" rx="5" fill="#10b981" opacity="0.7"/>
  <text x="256" y="614" fill="#6b7280" font-size="10" text-anchor="end">58%</text>
  <!-- AP3 bar -->
  <text x="24" y="632" fill="#374151" font-size="11">AP 3</text>
  <rect x="60" y="621" width="190" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="60" y="621" width="86" height="10" rx="5" fill="#f59e0b" opacity="0.7"/>
  <text x="256" y="632" fill="#6b7280" font-size="10" text-anchor="end">45%</text>

  <!-- ═══ CANVAS ═══ -->
  <rect x="288" y="0" width="992" height="800" fill="#f8fafc"/>
  <rect x="308" y="20" width="952" height="760" rx="4" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh5)"/>

  <!-- Grid -->
  <g stroke="#e2e8f0" stroke-width="0.4">
    <line x1="348" y1="20" x2="348" y2="780"/><line x1="388" y1="20" x2="388" y2="780"/>
    <line x1="428" y1="20" x2="428" y2="780"/><line x1="468" y1="20" x2="468" y2="780"/>
    <line x1="508" y1="20" x2="508" y2="780"/><line x1="548" y1="20" x2="548" y2="780"/>
    <line x1="588" y1="20" x2="588" y2="780"/><line x1="628" y1="20" x2="628" y2="780"/>
    <line x1="668" y1="20" x2="668" y2="780"/><line x1="708" y1="20" x2="708" y2="780"/>
    <line x1="748" y1="20" x2="748" y2="780"/><line x1="788" y1="20" x2="788" y2="780"/>
    <line x1="308" y1="60" x2="1260" y2="60"/><line x1="308" y1="100" x2="1260" y2="100"/>
    <line x1="308" y1="140" x2="1260" y2="140"/><line x1="308" y1="180" x2="1260" y2="180"/>
    <line x1="308" y1="220" x2="1260" y2="220"/><line x1="308" y1="260" x2="1260" y2="260"/>
    <line x1="308" y1="300" x2="1260" y2="300"/><line x1="308" y1="340" x2="1260" y2="340"/>
    <line x1="308" y1="380" x2="1260" y2="380"/><line x1="308" y1="420" x2="1260" y2="420"/>
    <line x1="308" y1="460" x2="1260" y2="460"/><line x1="308" y1="500" x2="1260" y2="500"/>
  </g>

  <!-- Heatmap blobs -->
  <rect x="308" y="20" width="952" height="760" fill="url(#h51)" rx="4"/>
  <rect x="308" y="20" width="952" height="760" fill="url(#h52)" rx="4"/>
  <rect x="308" y="20" width="952" height="760" fill="url(#h53)" rx="4"/>

  <!-- Walls -->
  <g stroke-linecap="round">
    <rect x="380" y="80" width="560" height="420" fill="none" stroke="#1e293b" stroke-width="6"/>
    <line x1="560" y1="80" x2="560" y2="320" stroke="#475569" stroke-width="4"/>
    <line x1="380" y1="320" x2="780" y2="320" stroke="#475569" stroke-width="4"/>
    <line x1="780" y1="80" x2="780" y2="500" stroke="#475569" stroke-width="4"/>
    <line x1="560" y1="200" x2="780" y2="200" stroke="#94a3b8" stroke-width="3"/>
  </g>

  <!-- APs -->
  <g transform="translate(540,200)">
    <circle r="20" fill="#3b82f6" fill-opacity="0.9"/>
    <g fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
      <path d="M-9,-5 A12,12 0 0,1 9,-5"/><path d="M-6,0 A8,8 0 0,1 6,0"/>
      <path d="M-3,5 A4,4 0 0,1 3,5"/><circle cx="0" cy="9" r="1.5" fill="white" stroke="none"/>
    </g>
    <text y="36" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="600" stroke="white" stroke-width="3" paint-order="stroke">AP 1</text>
  </g>
  <g transform="translate(830,180)">
    <circle r="20" fill="#10b981" fill-opacity="0.9"/>
    <g fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
      <path d="M-9,-5 A12,12 0 0,1 9,-5"/><path d="M-6,0 A8,8 0 0,1 6,0"/>
      <path d="M-3,5 A4,4 0 0,1 3,5"/><circle cx="0" cy="9" r="1.5" fill="white" stroke="none"/>
    </g>
    <text y="36" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="600" stroke="white" stroke-width="3" paint-order="stroke">AP 2</text>
  </g>
  <g transform="translate(680,540)">
    <circle r="20" fill="#f59e0b" fill-opacity="0.9"/>
    <g fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
      <path d="M-9,-5 A12,12 0 0,1 9,-5"/><path d="M-6,0 A8,8 0 0,1 6,0"/>
      <path d="M-3,5 A4,4 0 0,1 3,5"/><circle cx="0" cy="9" r="1.5" fill="white" stroke="none"/>
    </g>
    <text y="36" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="600" stroke="white" stroke-width="3" paint-order="stroke">AP 3</text>
  </g>

  <!-- RSSI probe tooltip on canvas -->
  <circle cx="650" cy="300" r="5" fill="#2563eb"/>
  <rect x="660" y="280" width="160" height="44" rx="8" fill="#1e293b" opacity="0.92"/>
  <text x="672" y="298" fill="white" font-size="11" font-weight="600">Best RSSI here</text>
  <text x="672" y="312" fill="#4ade80" font-size="12" font-weight="700">−57.8 dBm</text>
  <text x="672" y="318" fill="#86efac" font-size="10"> → Good coverage</text>

  <!-- Scale bar -->
  <rect x="320" y="770" width="80" height="3" fill="#475569"/>
  <line x1="320" y1="765" x2="320" y2="776" stroke="#475569" stroke-width="2"/>
  <line x1="400" y1="765" x2="400" y2="776" stroke="#475569" stroke-width="2"/>
  <text x="320" y="787" fill="#475569" font-size="11" font-family="monospace">4m</text>
</svg>
