<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <radialGradient id="ap1heat" cx="37%" cy="37%" r="32%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#00c800" stop-opacity="0.78"/>
      <stop offset="20%"  stop-color="#22c822" stop-opacity="0.75"/>
      <stop offset="40%"  stop-color="#c8c800" stop-opacity="0.7"/>
      <stop offset="60%"  stop-color="#dc8c00" stop-opacity="0.6"/>
      <stop offset="80%"  stop-color="#e64400" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e60000" stop-opacity="0.1"/>
    </radialGradient>
    <radialGradient id="ap2heat" cx="71%" cy="30%" r="28%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#00c800" stop-opacity="0.78"/>
      <stop offset="25%"  stop-color="#22c822" stop-opacity="0.74"/>
      <stop offset="50%"  stop-color="#c8c800" stop-opacity="0.68"/>
      <stop offset="75%"  stop-color="#dc6400" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e60000" stop-opacity="0.08"/>
    </radialGradient>
    <radialGradient id="ap3heat" cx="55%" cy="75%" r="24%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#00c800" stop-opacity="0.75"/>
      <stop offset="30%"  stop-color="#c8c800" stop-opacity="0.68"/>
      <stop offset="60%"  stop-color="#dc6400" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="legendGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00c800"/>
      <stop offset="33%"  stop-color="#c8c800"/>
      <stop offset="66%"  stop-color="#dc6400"/>
      <stop offset="100%" stop-color="#e60000"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="#f8fafc"/>

  <!-- Canvas area -->
  <rect x="0" y="0" width="1280" height="800" fill="white" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Grid -->
  <g stroke="#f1f5f9" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="800"/><line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/><line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/><line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="700" y1="0" x2="700" y2="800"/><line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/><line x1="1000" y1="0" x2="1000" y2="800"/>
    <line x1="1100" y1="0" x2="1100" y2="800"/><line x1="1200" y1="0" x2="1200" y2="800"/>
    <line x1="0" y1="80" x2="1280" y2="80"/><line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/><line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/><line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/><line x1="0" y1="640" x2="1280" y2="640"/>
    <line x1="0" y1="720" x2="1280" y2="720"/>
  </g>

  <!-- Heatmap blobs -->
  <rect x="0" y="0" width="1280" height="800" fill="url(#ap1heat)"/>
  <rect x="0" y="0" width="1280" height="800" fill="url(#ap2heat)"/>
  <rect x="0" y="0" width="1280" height="800" fill="url(#ap3heat)"/>

  <!-- Walls (over heatmap) -->
  <g stroke-linecap="round">
    <rect x="100" y="60" width="680" height="540" fill="none" stroke="#1e293b" stroke-width="7"/>
    <line x1="380" y1="60" x2="380" y2="380" stroke="#475569" stroke-width="5"/>
    <line x1="100" y1="380" x2="600" y2="380" stroke="#475569" stroke-width="5"/>
    <line x1="600" y1="60" x2="600" y2="600" stroke="#475569" stroke-width="5"/>
    <line x1="600" y1="240" x2="780" y2="240" stroke="#94a3b8" stroke-width="3"/>
    <line x1="380" y1="220" x2="600" y2="220" stroke="#94a3b8" stroke-width="3"/>
  </g>

  <!-- AP 1 (selected, with dashed ring) -->
  <g transform="translate(300,220)">
    <circle r="34" fill="none" stroke="white" stroke-width="2" stroke-dasharray="5,3" opacity="0.9"/>
    <circle r="28" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
    <circle r="20" fill="#3b82f6" stroke="white" stroke-width="2"/>
    <g fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round">
      <path d="M-9,-5 A12,12 0 0,1 9,-5"/>
      <path d="M-6,0 A8,8 0 0,1 6,0"/>
      <path d="M-3,5 A4,4 0 0,1 3,5"/>
      <circle cx="0" cy="9" r="1.8" fill="white" stroke="none"/>
    </g>
    <text y="38" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="700" stroke="white" stroke-width="3" paint-order="stroke">AP 1</text>
    <text y="50" text-anchor="middle" font-size="10" fill="#475569" stroke="white" stroke-width="2" paint-order="stroke">2.4 GHz · ch 6 · 20 dBm</text>
  </g>

  <!-- AP 2 -->
  <g transform="translate(730,180)">
    <circle r="28" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
    <circle r="20" fill="#10b981"/>
    <g fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round">
      <path d="M-9,-5 A12,12 0 0,1 9,-5"/>
      <path d="M-6,0 A8,8 0 0,1 6,0"/>
      <path d="M-3,5 A4,4 0 0,1 3,5"/>
      <circle cx="0" cy="9" r="1.8" fill="white" stroke="none"/>
    </g>
    <text y="38" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="700" stroke="white" stroke-width="3" paint-order="stroke">AP 2</text>
    <text y="50" text-anchor="middle" font-size="10" fill="#475569" stroke="white" stroke-width="2" paint-order="stroke">5 GHz · ch 36 · 23 dBm</text>
  </g>

  <!-- AP 3 -->
  <g transform="translate(550,580)">
    <circle r="28" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
    <circle r="20" fill="#f59e0b"/>
    <g fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round">
      <path d="M-9,-5 A12,12 0 0,1 9,-5"/>
      <path d="M-6,0 A8,8 0 0,1 6,0"/>
      <path d="M-3,5 A4,4 0 0,1 3,5"/>
      <circle cx="0" cy="9" r="1.8" fill="white" stroke="none"/>
    </g>
    <text y="38" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="700" stroke="white" stroke-width="3" paint-order="stroke">AP 3</text>
    <text y="50" text-anchor="middle" font-size="10" fill="#475569" stroke="white" stroke-width="2" paint-order="stroke">2.4 GHz · ch 1 · 20 dBm</text>
  </g>

  <!-- Legend panel (bottom right) -->
  <rect x="930" y="680" width="330" height="100" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="950" y="703" fill="#374151" font-size="12" font-weight="600">Signal Strength Legend</text>
  <rect x="950" y="712" width="290" height="14" rx="4" fill="url(#legendGrad)" opacity="0.85"/>
  <text x="950" y="742" fill="#374151" font-size="10">Excellent</text>
  <text x="1045" y="742" fill="#374151" font-size="10" text-anchor="middle">Good</text>
  <text x="1140" y="742" fill="#374151" font-size="10" text-anchor="middle">Fair</text>
  <text x="1234" y="742" fill="#374151" font-size="10" text-anchor="end">Poor</text>
  <text x="950" y="756" fill="#64748b" font-size="10">≥ −50 dBm</text>
  <text x="1045" y="756" fill="#64748b" font-size="10" text-anchor="middle">−60</text>
  <text x="1140" y="756" fill="#64748b" font-size="10" text-anchor="middle">−70</text>
  <text x="1234" y="756" fill="#64748b" font-size="10" text-anchor="end">−80 dBm</text>
  <text x="950" y="772" fill="#6b7280" font-size="11">Coverage: 78.4%  |  Avg RSSI: −61.3 dBm</text>

  <!-- Scale bar -->
  <rect x="20" y="773" width="100" height="3" fill="#475569"/>
  <line x1="20" y1="768" x2="20" y2="778" stroke="#475569" stroke-width="2"/>
  <line x1="120" y1="768" x2="120" y2="778" stroke="#475569" stroke-width="2"/>
  <text x="20" y="790" fill="#475569" font-size="11" font-family="monospace">5 m</text>
</svg>
