name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

jobs:
  # ─── Dependency security audit ──────────────────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run audit:check

  # ─── Rust / WASM tests ──────────────────────────────────────────────────────
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wasm-engine/target
          key: rust-${{ hashFiles('wasm-engine/Cargo.lock') }}
          restore-keys: rust-

      - name: Run Rust unit tests
        run: cd wasm-engine && cargo test

  # ─── TypeScript lint + unit tests + build ───────────────────────────────────
  frontend:
    name: Frontend (lint · type-check · test · build)
    runs-on: ubuntu-latest
    needs: rust-test          # WASM pkg must exist before tsc / vite build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Rust stable + wasm-pack
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wasm-engine/target
          key: rust-${{ hashFiles('wasm-engine/Cargo.lock') }}
          restore-keys: rust-

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build WASM engine
        run: npm run build:wasm:force

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npx vite build
